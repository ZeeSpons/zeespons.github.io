<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeespons.com - Grid</title>
  <link rel="icon" type="image/png" href="media/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  
  <!-- Jouw Open Graph tags (opgeschoond & geoptimaliseerd) -->
  <meta property="og:title" content="Zeespons.com™">
  <meta property="og:description" content="Welkom op zeespons.com">
  <meta property="og:image" content="https://www.zeespons.com/media/og.png">
  <meta property="og:url" content="https://www.zeespons.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <!-- De Header met klikbaar logo en titel naar de homepagina -->
  <header class="main-header">
    <a href="index.html" class="header-brand">
      <div class="logo-container">
        <img src="assets/logo.webp" alt="Zeespons Logo" class="header-logo" />
      </div>
      <div class="site-title">ZEESPONS.com</div>
    </a>
    <nav class="nav-menu">
      <a href="index.html">Home</a>
      <a href="grid.html" class="active">Grid</a>
      <a href="links.html">Links</a>
    </nav>
  </header>

  <!-- Het Slimme Automatisch Herhalende Bento Grid -->
  <main class="bento-container">
    
    <!-- Rij 1: S | L -->
    <div class="bento-box">
      <a href="https://www.zeespons.com/files/7tv.txt" target="_blank" rel="noopener">
      <span class="link-name">7TV Uitleg</span></a>
      <p>Uitleg om een editor toe te voegen aan 7TV</p>

    </div>
    
    <div class="bento-box box-content-split">
      <div class="foto-placeholder">Foto</div>
      <p>Blok 2 (L)</p>
    </div>
    
    <!-- Rij 2: M | M -->
    <div class="bento-box">
      <div class="icon">📱</div>
      <p>Blok 3 (M)</p>
    </div>
    <div class="bento-box">
      <div class="icon">📝</div>
      <p>Blok 4 (M)</p>
    </div>

    <!-- Rij 3: L | S -->
    <div class="bento-box">
      <p>Blok 5 (L)</p>
    </div>
    
    <div class="bento-box">
      <p>Blok 6 (S)</p>
    </div>

    <!-- Rij 4: S | L -->
    <div class="bento-box">
      <p>Blok 7 (S)</p>
    </div>

    <div class="bento-box">
      <p>Blok 8 (L)</p>
    </div>

    <div class="bento-box">
      <p>Blok 9 (M)</p>
    </div>

    <!-- Voeg hieronder simpelweg extra <div class="bento-box"> toe om de lijst uit te breiden -->

  </main>

</body>
</html>
