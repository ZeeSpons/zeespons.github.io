<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeespons.com - Grid</title>
  <link rel="icon" type="image/png" href="media/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  
  <!-- Jouw Open Graph tags (opgeschoond & geoptimaliseerd) -->
  <meta property="og:title" content="Zeespons.com™">
  <meta property="og:description" content="Welkom op zeespons.com">
  <meta property="og:image" content="https://www.zeespons.com/media/og.png">
  <meta property="og:url" content="https://www.zeespons.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <!-- De Header uit jouw nieuwe schets, met gebruik van je logo -->
  <header class="main-header">
    <div class="logo-container">
      <!-- Hier laad je jouw zwaaiende spons logo in (bijvoorbeeld als logo.png) -->
      <img src="assets/logo.png" alt="Zeespons Logo" class="header-logo" />
    </div>
    <div class="site-title">ZEESPONS.com</div>
    <nav class="nav-menu">
      <a href="index.html">Home</a>
      <a href="grid.html" class="active">Grid</a>
      <a href="links.html">Links</a>
    </nav>
  </header>

  <!-- Het Bento Grid uit jouw schets -->
  <main class="bento-container">
    <div class="bento-box box-small-text">TEXT</div>
    
    <div class="bento-box box-wide">
      <div class="foto-placeholder">Foto</div>
      <p>VAK MET TEXT</p>
    </div>
    
    <div class="bento-box box-medium">
      <div class="icon">📱</div>
      <p>Korte tekst of feed...</p>
    </div>
    
    <div class="bento-box box-medium">
      <div class="icon">📝</div>
      <p>Lopend tekstblok dat langer doorloopt...</p>
    </div>
    
    <div class="bento-box box-wide">
      <p>Ander breed wisselend tekstblok...</p>
    </div>
    
    <div class="bento-box box-small">Blokje</div>
  </main>

</body>
</html>
