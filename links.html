<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeespons.com - Links</title>
  <link rel="icon" type="image/png" href="media/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  
  <!-- Open Graph tags -->
  <meta property="og:title" content="Zeespons.com™ - Links">
  <meta property="og:description" content="Alle officiële links van Zeespons op een rij.">
  <meta property="og:image" content="https://zeespons.com/media/og.png">
  <meta property="og:url" content="https://zeespons.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <!-- De Header (Identiek aan je grid pagina) -->
  <header class="main-header">
    <div class="logo-container">
      <img src="assets/logo.webp" alt="Zeespons Logo" class="header-logo" />
    </div>
    <div class="site-title">ZEESPONS.com</div>
    <nav class="nav-menu">
      <a href="index.html">Home</a>
      <a href="grid.html">Grid</a>
      <a href="links.html" class="active">Links</a>
    </nav>
  </header>

  <!-- Content Container voor de Links -->
  <main class="links-container">

    <!-- CATEGORIE 1 (Voorbeeld: Hoofdkanalen) -->
    <section class="links-category">
      <h2 class="category-title">ZEESPONS LINKS</h2>
      <div class="links-grid">
        
        <a href="https://twitch.tv" target="_blank" rel="noopener" class="link-card">
          <img src="assets/twitch.webp" alt="Twitch" class="link-icon" />
          <span class="link-name">Twitch</span>
        </a>

        <a href="https://youtube.com" target="_blank" rel="noopener" class="link-card">
          <img src="assets/youtube.webp" alt="YouTube" class="link-icon" />
          <span class="link-name">YouTube</span>
        </a>

        <a href="https://discord.gg" target="_blank" rel="noopener" class="link-card">
          <img src="assets/discord.webp" alt="Discord" class="link-icon" />
          <span class="link-name">Discord</span>
        </a>

        <a href="https://tiktok.com" target="_blank" rel="noopener" class="link-card">
          <img src="assets/tiktok.webp" alt="TikTok" class="link-icon" />
          <span class="link-name">TikTok</span>
        </a>

      </div>
    </section>

    <!-- CATEGORIE 2 (Voorbeeld: Andere projecten / Aliassen) -->
    <section class="links-category">
      <h2 class="category-title">ANDERE PROJECTEN</h2>
      <div class="links-grid">

        <a href="https://spotify.com" target="_blank" rel="noopener" class="link-card">
          <img src="assets/spotify.webp" alt="Spotify" class="link-icon" />
          <span class="link-name">Spotify Afspeellijst</span>
        </a>

        <a href="https://instagram.com" target="_blank" rel="noopener" class="link-card">
          <img src="assets/instagram.webp" alt="Instagram" class="link-icon" />
          <span class="link-name">Instagram</span>
        </a>

      </div>
    </section>

  </main>

  <!-- Professionele, anonieme footer -->
  <footer class="main-footer">
    <p>© 2026 Zeespons. Alle rechten voorbehouden.</p>
  </footer>

</body>
</html>
