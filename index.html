<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zeespons.com - Home</title>
  <link rel="icon" type="image/png" href="media/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  
  <!-- Open Graph tags -->
  <meta property="og:title" content="Zeespons.com™">
  <meta property="og:description" content="Welkom op zeespons.com - De centrale hub van Zeespons.">
  <meta property="og:image" content="https://zeespons.com/media/og.png">
  <meta property="og:url" content="https://zeespons.com">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>

  <!-- De Header (Identiek aan je andere pagina's) -->
  <header class="main-header">
    <div class="logo-container">
      <img src="assets/logo.webp" alt="Zeespons Logo" class="header-logo" />
    </div>
    <div class="site-title">ZEESPONS.com</div>
    <nav class="nav-menu">
      <a href="index.html" class="active">Home</a>
      <a href="grid.html">Grid</a>
      <a href="links.html">Links</a>
    </nav>
  </header>

  <!-- De Main Hero Sectie -->
  <main class="hero-container">
    <div class="hero-content">
      <!-- Groot, centraal logo op de homepage -->
      <div class="hero-logo-wrapper">
        <img src="assets/logo.webp" alt="Zeespons" class="hero-main-logo" />
      </div>
      
      <!-- Professionele, anonieme introductie -->
      <h1 class="hero-title">Welkom bij <span class="highlight-text">Zeespons</span></h1>
      <p class="hero-subtitle">
        Een centrale hub voor digitale projecten, content creatie en internet experimenten. Volledig gebouwd vanuit de schaduw van het web.
      </p>

      <!-- Strakke Call-to-Action knoppen naar je andere pagina's -->
      <div class="hero-buttons">
        <a href="grid.html" class="btn btn-primary">Bekijk mijn Grid</a>
        <a href="links.html" class="btn btn-secondary">Social Links</a>
      </div>
    </div>
  </main>

  <!-- De Footer -->
  <footer class="main-footer">
    <p>© 2026 Zeespons. Alle rechten voorbehouden.</p>
  </footer>

</body>
</html>
